pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 2113536;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 120s;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/secrets/tls.crt;
        ssl_certificate_key /run/secrets/tls.key;
        root /usr/share/nginx/html;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        location /api/v1/ {
            proxy_pass http://control-plane:8080;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 120s;
            proxy_send_timeout 30s;
            proxy_request_buffering on;
            proxy_buffering off;
            proxy_set_header Host control-plane;
            proxy_set_header Connection "";
            proxy_set_header Cookie "";
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Cache-Control;
        }
        location ~* ^/(actuator|internal|health|ready)(/|$) { return 404; }
        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ /index.html;
        }
    }
}
