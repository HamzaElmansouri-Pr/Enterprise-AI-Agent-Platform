[project]
name = "agent-runtime"
version = "0.0.1"
description = "Enterprise AI Agent Platform runtime foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "fastembed==0.9.1",
  "langgraph==1.2.24",
  "openai==2.37.0",
  "pydantic==2.14.4",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.2.0",
  "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
