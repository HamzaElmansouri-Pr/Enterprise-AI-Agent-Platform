# Offline operator only. No HTTP server, migrations, or generated administrator on normal startup.
spring:
  main:
    web-application-type: none
  autoconfigure:
    exclude:
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
  datasource:
    username: eaap_identity_operator
    password: ${IDENTITY_OPERATOR_DB_PASSWORD}
    hikari:
      maximum-pool-size: 1
