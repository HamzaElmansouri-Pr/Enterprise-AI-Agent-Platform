spring:
  servlet:
    multipart:
      max-file-size: 2097152B
      max-request-size: 2113536B
      file-size-threshold: 0B
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-trailing-tokens: true
    parser:
      strict-duplicate-detection: true
  application:
    name: control-plane
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/eaap_dev}
    username: eaap_runtime
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      connection-timeout: 2000
      validation-timeout: 1000
      initialization-fail-timeout: -1
      idle-timeout: 60000
      max-lifetime: 600000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
        options: -c statement_timeout=3000 -c lock_timeout=1000 -c idle_in_transaction_session_timeout=10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot.allow_jdbc_metadata_access: false
        jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    enabled: false
    clean-disabled: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  health:
    db:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never

knowledge:
  worker:
    enabled: ${KNOWLEDGE_WORKER_ENABLED:false}

# Parser diagnostics may echo untrusted contents; expose safe failure codes instead.
logging:
  level:
    org.apache.pdfbox: 'OFF'
    org.apache.fontbox: 'OFF'
